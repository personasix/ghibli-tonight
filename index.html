<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghibli Tonight?</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <h1>Ghibli Tonight?</h1>
        <p>Pick a film. Put the kettle on.</p>

        <button id="pick-movie" type="button" disabled>Pick a movie</button>
        <p id="movie-status" role="status">Loading the film list...</p>

        <article id="movie-card" aria-labelledby="movie-title" hidden>
            <h2 id="movie-title"></h2>
            <div id="movie-poster"></div>
            <p id="movie-details"></p>
            <p id="movie-description"></p>
        </article>
    </main>
</body>
</html>
